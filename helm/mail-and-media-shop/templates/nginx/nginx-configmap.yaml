apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mail-and-media-shop.fullname" . }}-nginx-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mail-and-media-shop.labels" . | nindent 4 }}
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    http {
        server {
            listen 80;
            resolver 10.96.0.10 valid=10s ipv6=off;
            location /healthz {
                access_log off;
                return 200 "OK\n";
            }
            location / {
                set $upstream_app http://{{ include "mail-and-media-shop.fullname" . }}:{{ .Values.app.service.port | default 8090 }};
                proxy_pass $upstream_app;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
    }
